name: release

# Builds release binaries when a version tag (v1.2.3) is pushed and attaches
# them, with checksums, to a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/}
            ext=""
            [ "$os" = windows ] && ext=".exe"
            for cmd in switchyard simengine loadgen; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
                -o "dist/${cmd}_${GITHUB_REF_NAME}_${os}_${arch}${ext}" "./cmd/$cmd"
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
