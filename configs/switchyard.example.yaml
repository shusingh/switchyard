# Switchyard configuration reference.
#
# Every field is optional except `backends`; the values shown are the
# defaults. Durations use Go syntax ("250ms", "2s", "10m"). Unknown fields are
# rejected at startup, so a typo fails loudly instead of being ignored.

server:
  listen: ":8080"
  read_header_timeout: 10s
  idle_timeout: 120s
  # Long agent prompts with tool definitions can reach several megabytes.
  max_request_bytes: 16777216
  # How long in-flight requests may finish after SIGTERM before they are cut.
  shutdown_timeout: 30s

# The model servers to route to. Each needs a unique id and a base URL
# without the /v1 path.
backends:
  - id: vllm-0
    url: http://localhost:8001
  - id: vllm-1
    url: http://localhost:8002

health:
  path: /health
  interval: 2s
  timeout: 1s
  # Consecutive failures before a healthy backend stops receiving traffic.
  unhealthy_threshold: 3
  # Consecutive successes before an unhealthy backend receives traffic again.
  # The first successful check after startup marks a backend healthy at once.
  healthy_threshold: 2

proxy:
  dial_timeout: 2s
  # Non-streaming completions send headers only when generation finishes, so
  # this must exceed the longest expected generation.
  response_header_timeout: 10m
  # A stream that produces no event for this long is aborted.
  stream_idle_timeout: 60s
  max_idle_conns_per_host: 256
  # Retry a request on another backend when it failed transiently
  # (connection failure, 502, 503, 504) before anything reached the client.
  max_retries: 1
  # Retries may not exceed this fraction of requests.
  retry_budget_ratio: 0.1
  # Consecutive failed requests that take a backend out of rotation, and how
  # long before a single trial request is let through. 0 disables.
  breaker_failures: 5
  breaker_cooldown: 30s

routing:
  # One of: estimated_ttft, least_loaded, p2c, prefix_affinity, random,
  # round_robin. estimated_ttft is Switchyard's cache- and load-aware policy;
  # the others are baselines for comparison.
  policy: round_robin

  # Prefix tracking (docs/engineering/design.md sections 6 and 7). The router
  # maintains it under every policy, so overhead is equal across policies.
  block_bytes: 128
  max_blocks: 4096
  # How long the router trusts that a backend still caches a prefix.
  index_ttl: 10m
  # Request bytes per token; refined at run time from reported usage.
  bytes_per_token: 4.0
  # KV cache capacity per backend. For vLLM, num_gpu_blocks times block_size
  # from vllm:cache_config_info. Backends can override it individually.
  kv_capacity_tokens: 100000

  # Time-to-first-token model (design.md section 9).
  # Initial prefill throughput; refined at run time from observed TTFT.
  prefill_tokens_per_second: 10000
  ttft_overhead: 20ms
  decode_penalty: 500us
  # Imbalance guard: skip backends with more than balance_abs more in-flight
  # requests than the idlest and more than balance_rel times as many.
  balance_abs: 16
  balance_rel: 1.5
  # Predictions within this fraction of the best count as ties.
  tie_epsilon: 0.05

log:
  # One of: debug, info, warn, error.
  level: info

# Tenant budgets and fair queuing (docs/engineering/design.md section 10).
admission:
  # Concurrently running requests across all tenants; beyond this, requests
  # wait in per-tenant queues served fairly by weight.
  max_in_flight: 512
  queue_timeout: 30s
  # Fair-queuing credit per round, times a tenant's weight; near a typical
  # request's cost in tokens.
  quantum_tokens: 4096
  # Identify tenants by X-Tenant-ID instead of the bearer token. Enable only
  # behind a gateway that sets the header itself.
  trust_tenant_header: false
  # Requests that match no tenant. tokens_per_second 0 means no budget.
  default_tenant:
    name: default
    weight: 1
    max_queued: 256
  tenants:
    - name: research
      api_keys: ["sk-research-example"]
      weight: 2
      # Sustained budget in estimated tokens; burst defaults to 10 seconds'
      # worth.
      tokens_per_second: 50000
      max_queued: 128
